<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transmissão de tela</title>
  <link rel="icon" href="/assets/img/logo.svg">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/home.css">
</head>
<body class="home">
  <header class="home__top"><img data-logo class="logo" alt=""></header>
  <main class="home__main">
    <section class="intro">
      <h1><span data-t="home.title.0"></span> <em data-t="home.title.1"></em></h1>
      <p class="intro__sub" data-t="home.subtitle"></p>
      <ul class="features" id="features"></ul>
    </section>
    <section class="card">
      <h2 data-t="home.cardTitle"></h2>
      <p class="muted" data-t="home.cardHint"></p>
      <div class="row"><span class="avatar avatar--lg" id="avatar">?</span><input id="name" maxlength="24" placeholder="Seu nome" autocomplete="off" autofocus></div>
      <button class="btn btn--primary" id="create">Criar sala</button>
      <div class="or"><span>ou</span></div>
      <label class="label" for="code">CÓDIGO DA SALA</label>
      <form class="row" id="joinForm">
        <input id="code" autocomplete="off">
        <button class="btn btn--ghost"><i data-icon="arrow"></i>Entrar</button>
      </form>
      <p class="error" id="error" hidden></p>
    </section>
  </main>
  <script type="module" src="/assets/js/pages/home.js"></script>
</body>
</html>
